name: C6.2 isolated full-frame retarget calibration proof
# R2 re-evaluation: source-anatomical absolute T/A calibration after visual failure.
on:
  push:
    branches: [feat/c6-2-animation-baking-studio-playback]
    paths:
      - '.github/workflows/c6-2-retarget-proof.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  retarget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Retrieve original previously acquired CC0 source (not production assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/c62-sources
          gh run download 44360056543 -n c6-2-motion-source-probe -D /tmp/c62-sources
          echo "Source archive byte sizes:"
          ls -lh /tmp/c62-sources/UAL1-Standard.zip
          echo "cc73fc4e495b82958207316596317a3f40b9fa38065bde1027937452da537724  /tmp/c62-sources/UAL1-Standard.zip" | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path=Path('/tmp/c62-sources/UAL1-Standard.zip')
          with ZipFile(path) as zip:
              matches=[x for x in zip.namelist() if x.endswith('/Unreal-Godot/UAL1_Standard.glb')]
              if len(matches)!=1: raise SystemExit('Unambiguous UAL1 Standard GLB required')
              data=zip.read(matches[0])
              Path('/tmp/c62-ual1.glb').write_bytes(data)
          PY
          echo "69591853d817488edaa8fd9bf8fc1d821eaeaf789f8627b3cd23b41c4ed67997  /tmp/c62-ual1.glb" | sha256sum -c
      - name: Extract 4 source clips and glTF inverse bind matrices
        run: |
          node scripts/extract-quaternius-ual1.mjs /tmp/c62-ual1.glb /tmp/c62-source-4.json --include-bind --include-sprint
      - name: Acquire pinned actual MakeHuman data
        run: node scripts/fetch-makehuman-core.mjs
      - name: Bake reusable profile and four candidate clips, without overwriting accepted library
        run: |
          node scripts/bake-c62-calibrated.mjs --source /tmp/c62-source-4.json --output /tmp/c62-candidate --write
          cat /tmp/c62-candidate/manifest.json
      - name: Validate deterministic candidate replay
        run: |
          node scripts/bake-c62-calibrated.mjs --source /tmp/c62-source-4.json --output /tmp/c62-candidate
      - name: Run source/rest retarget tests
        run: pnpm exec vitest run tests/character-animation-c6-2-retargeting.test.ts tests/character-animation-c6-2-ual1-mapping.test.ts tests/character-animation-c6-2-real-calibration.test.ts --pool=threads --maxWorkers=1
      - name: Commit quarantined candidate library only after verified reproducible bake
        run: |
          mkdir -p assets/animations/candidate-c62-v1
          cp /tmp/c62-candidate/*.json assets/animations/candidate-c62-v1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animations/candidate-c62-v1
          if ! git diff --cached --quiet; then
            git commit -m "assets(c6.2): stage deterministic four-clip calibrated candidates for review"
            git fetch origin feat/c6-2-animation-baking-studio-playback
            git rebase origin/feat/c6-2-animation-baking-studio-playback
            git push origin HEAD:feat/c6-2-animation-baking-studio-playback
          fi
      - name: Upload review-only candidate profile, clips, manifest and source fingerprint
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: c62-reusable-retarget-candidate
          path: /tmp/c62-candidate/
          retention-days: 7
