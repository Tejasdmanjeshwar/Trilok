name: Temporary C2 Lab Retirement Visual Validation
# One-time PR-only rendered parity evidence for retiring the legacy Lab.
# REMOVE this workflow before merge. It is not Phase Acceptance.
on:
  pull_request:
    paths:
      - '.github/workflows/lab-retirement-visual.yml'
      - 'e2e/studio-source-parity.spec.ts'
      - 'e2e/studio.spec.ts'
permissions:
  contents: read

concurrency:
  group: lab-retirement-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    name: Legacy Lab migration Chromium (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, touch-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Reuse verified pinned source
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public/anatomy/makehuman-base.obj
            apps/web/public/anatomy/makehuman-default.mhskel
            apps/web/public/anatomy/makehuman-default_weights.mhw
            apps/web/public/anatomy/makehuman-facial-v1.json
            assets/cache/makehuman-body-v1.json
          key: makehuman-pinned-v1-${{ runner.os }}-${{ hashFiles('assets/makehuman-core.json', 'assets/makehuman-body-v1.json', 'assets/makehuman-facial-v1.json', 'scripts/fetch-makehuman-*.mjs', 'scripts/fetch-pinned-source.mjs') }}
      - run: pnpm build
      - run: node scripts/verify-build-identity.mjs
      - name: Confirm Lab is not shipped
        run: test ! -e apps/web/dist/c2-lab.html
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run focused Studio parity screenshots and navigation
        env:
          PROJECT: ${{ matrix.project }}
        run: >
          pnpm exec playwright test
          e2e/studio-source-parity.spec.ts
          e2e/studio.spec.ts
          e2e/studio-customization.spec.ts
          --project="$PROJECT"
          --retries=0 --workers=1
          --reporter=list
      - name: Upload actual rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-retirement-${{ matrix.project }}-${{ github.sha }}
          path: |
            test-results/studio-source-parity/
            test-results/studio/
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Record exact tested revision
        if: always()
        env:
          PROJECT: ${{ matrix.project }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          echo "## C2 Lab retirement browser parity" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: $PROJECT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact tested SHA: $TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- This is focused migration QA, NOT C6 Phase Acceptance." >> "$GITHUB_STEP_SUMMARY"
