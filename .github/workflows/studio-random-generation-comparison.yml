name: Character Studio random generation comparison
on:
  pull_request:
    paths:
      - "apps/web/src/studio/**"
      - "apps/web/src/characters/geometry/**"
      - "e2e/studio-generation-performance.spec.ts"
      - ".github/workflows/studio-random-generation-comparison.yml"

permissions:
  contents: read

concurrency:
  group: studio-random-compare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Browser before/after (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, touch-chromium]
    steps:
      - name: Checkout exact proposed source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Checkout exact base source HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install both pinned dependency trees
        run: |
          cd candidate && pnpm install --frozen-lockfile
          cd ../baseline && pnpm install --frozen-lockfile
      - name: Reuse checksum-validated pinned source assets
        uses: actions/cache@v4
        with:
          path: |
            candidate/apps/web/public/anatomy/makehuman-base.obj
            candidate/apps/web/public/anatomy/makehuman-default.mhskel
            candidate/apps/web/public/anatomy/makehuman-default_weights.mhw
            candidate/apps/web/public/anatomy/makehuman-facial-v1.json
            candidate/assets/cache/makehuman-body-v1.json
          key: makehuman-pinned-v1-${{ runner.os }}-${{ hashFiles('candidate/assets/makehuman-core.json', 'candidate/assets/makehuman-body-v1.json', 'candidate/assets/makehuman-facial-v1.json', 'candidate/scripts/fetch-makehuman-*.mjs', 'candidate/scripts/fetch-pinned-source.mjs') }}
      - name: Build exact candidate with verified pinned assets
        working-directory: candidate
        env:
          TRILOK_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm build
      - name: Reuse independently verified asset bytes in baseline
        run: |
          mkdir -p baseline/apps/web/public/anatomy baseline/assets/cache
          cp candidate/apps/web/public/anatomy/makehuman-base.obj baseline/apps/web/public/anatomy/
          cp candidate/apps/web/public/anatomy/makehuman-default.mhskel baseline/apps/web/public/anatomy/
          cp candidate/apps/web/public/anatomy/makehuman-default_weights.mhw baseline/apps/web/public/anatomy/
          cp candidate/apps/web/public/anatomy/makehuman-facial-v1.json baseline/apps/web/public/anatomy/
          cp candidate/assets/cache/makehuman-body-v1.json baseline/assets/cache/
      - name: Build exact baseline (revalidates pinned assets)
        working-directory: baseline
        env:
          TRILOK_COMMIT_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm build
      - name: Install actual Chromium desktop/touch runner
        working-directory: candidate
        run: pnpm exec playwright install --with-deps chromium
      - name: Use identical measurement harness on both source revisions
        run: cp candidate/e2e/studio-generation-performance.spec.ts baseline/e2e/studio-generation-performance.spec.ts
      - name: Measure baseline and render identical seeds
        working-directory: baseline
        env:
          CI: "true"
          PROJECT: ${{ matrix.project }}
        run: pnpm exec playwright test e2e/studio-generation-performance.spec.ts --project="$PROJECT" --retries=0
      - name: Measure candidate and render identical seeds
        working-directory: candidate
        env:
          CI: "true"
          PROJECT: ${{ matrix.project }}
        run: pnpm exec playwright test e2e/studio-generation-performance.spec.ts --project="$PROJECT" --retries=0
      - name: Publish measured comparison (not a claimed speedup)
        if: success()
        env:
          PROJECT: ${{ matrix.project }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync,appendFileSync} from "node:fs";
          const p=process.env.PROJECT;
          const read=dir=>JSON.parse(readFileSync(dir+"/test-results/studio/random-generation-performance-"+p+".json","utf8"));
          const base=read("baseline"),head=read("candidate");
          const rows=[
            ["Initial Studio ready",base.startupMs,head.startupMs],
            ...base.captures.map((x,i)=>["Generate seed "+x.seed,x.elapsedMs,head.captures[i].elapsedMs]),
            ["Warm reload ready",base.warmReloadReadyMs,head.warmReloadReadyMs],
            ["Warm reload first Generate",base.warmReloadFirstGenerationMs,head.warmReloadFirstGenerationMs],
          ];
          const table=[
            "## Character Studio browser comparison ("+p+")",
            "Base: "+process.env.BASE_SHA+"; candidate: "+process.env.HEAD_SHA,
            "| Measurement | Baseline ms | Candidate ms | Ratio base/candidate |",
            "|---|---:|---:|---:|",
            ...rows.map(([label,a,b])=>"| "+label+" | "+a+" | "+b+" | "+(b>0?(a/b).toFixed(2):"n/a")+" |"),
            "",
            "These are actual browser wall times on this one shared runner; not an unqualified production-device claim. Review screenshots and JSON resource timings before acceptance."
          ].join("\n");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,table+"\n");
          console.log(table);
          NODE
      - name: Upload baseline/candidate screenshots and JSON traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-generation-${{ matrix.project }}-${{ github.event.pull_request.head.sha }}
          path: |
            baseline/test-results/studio/*.json
            baseline/test-results/studio/*.png
            candidate/test-results/studio/*.json
            candidate/test-results/studio/*.png
          if-no-files-found: ignore
          retention-days: 14
