name: C5.5 Off-thread Bow Browser Evidence

# Focused, premerge Chromium evidence only for the latest-only source worker.
# Unlike the C5 Phase Acceptance workflow, this does not accept the phase.
on:
  pull_request:
    paths:
      - '.github/workflows/c55-offthread-bow-browser.yml'
      - 'apps/web/src/studio/StudioArcherySolver.worker.ts'
      - 'apps/web/src/studio/StudioArcheryWorkerClient.ts'
      - 'apps/web/src/studio/StudioArcheryWorkerProtocol.ts'
      - 'apps/web/src/studio/StudioPosePreview.ts'
      - 'apps/web/src/studio/StudioViewport.ts'
      - 'e2e/c55-integrated-audit.spec.ts'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-build-identity.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify source-bow worker on desktop and touch Chromium
        run: pnpm exec playwright test e2e/c55-integrated-audit.spec.ts --project=desktop-chromium --project=touch-chromium
      - name: Upload independent input and solved-pose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c55-worker-browser-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/c55/**
            test-results/**/*.png
            test-results/**/*.json
          retention-days: 14
          if-no-files-found: warn
