name: C6.2 calibrated candidate visual proof
on:
  push:
    branches: [feat/c6-2-animation-baking-studio-playback]
    paths: ['.github/workflows/c6-2-candidate-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Acquire pinned MakeHuman assets and build current candidate Studio
        run: pnpm build
      - name: Install supported Chromium and OS dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Test desktop and touch candidate multi-view, morphology and C5 restoration
        run: pnpm exec playwright test e2e/studio-animation-c6-2-calibrated.spec.ts --project=desktop-chromium --project=touch-chromium
      - name: Preserve rendered evidence, including unsuccessful cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c62-calibrated-desktop-touch-screens
          path: |
            test-results/c62-calibrated/
            test-results/**/*.png
            test-results/**/*.zip
          retention-days: 7
