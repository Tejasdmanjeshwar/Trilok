name: C5.2 browser grip review
# Focused draft-PR visual evidence, not the full manually dispatched
# phase-acceptance gate. No production deployment or merge permissions.
on:
  push:
    branches:
      - feature/c5-2-two-hand-grips-arm-ik
    paths:
      - "apps/web/src/studio/**"
      - "tests/character-studio-two-hand-*.test.ts"
      - "e2e/studio-two-hand-grip.spec.ts"
      - ".github/workflows/c52-browser-review.yml"

permissions:
  contents: read

jobs:
  browser-grip:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --no-frozen-lockfile
      - name: Restore pinned source geometry
        run: node scripts/fetch-makehuman-core.mjs
      - run: pnpm build
      - run: node scripts/verify-build-identity.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture desktop/touch source-anatomy grip evidence
        run: pnpm exec playwright test e2e/studio-two-hand-grip.spec.ts
      - name: Upload full-size browser evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c52-browser-grips-${{ github.sha }}
          path: |
            test-results/studio/*.png
            test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 14
