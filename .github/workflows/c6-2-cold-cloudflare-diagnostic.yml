name: C6.2 cold Cloudflare build diagnostic
on:
  push:
    branches: [feat/c6-2-animation-baking-studio-playback]
    paths: ['.github/workflows/c6-2-cold-cloudflare-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Verify fresh MakeHuman asset acquisition and cold production bundle
        run: |
          test ! -f apps/web/public/anatomy/makehuman-base.obj
          /usr/bin/time -f 'Cold build duration: %e seconds / peak RSS %M KiB' pnpm build
          node scripts/verify-build-identity.mjs
      - name: Probe Cloudflare deployability without releasing a service
        run: |
          pnpm exec wrangler deploy --dry-run --outdir /tmp/c62-cloudflare-dry-run
          du -sh apps/web/dist
          find apps/web/dist -type f -size +24M -printf 'OVERSIZE %p %s bytes\n'
      - name: Diagnose separate staging deployment credentials (presence only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "STAGING_DEPLOY_CREDENTIALS_PRESENT"
          else
            echo "STAGING_DEPLOY_CREDENTIALS_UNAVAILABLE"
          fi
