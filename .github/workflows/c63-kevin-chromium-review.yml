name: C6.3 Kevin rendered Chromium review
# Explicitly manual rendered inspection. Never consume browser CI on each PR.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Cache pinned MakeHuman assets
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public/anatomy/makehuman-base.obj
            apps/web/public/anatomy/makehuman-default.mhskel
            apps/web/public/anatomy/makehuman-default_weights.mhw
            apps/web/public/anatomy/makehuman-facial-v1.json
            assets/cache/makehuman-body-v1.json
          key: makehuman-pinned-v1-${{ runner.os }}-${{ hashFiles('assets/makehuman-core.json', 'assets/makehuman-body-v1.json', 'assets/makehuman-facial-v1.json', 'scripts/fetch-makehuman-*.mjs', 'scripts/fetch-pinned-source.mjs') }}
      - name: Fetch verified MakeHuman assets
        run: node scripts/fetch-makehuman-core.mjs
      - name: Build current integrated game
        run: pnpm build
      - name: Install Chromium software renderer
        run: pnpm exec playwright install --with-deps chromium
      - name: Test source-backed Kevin and approved UAL1 skinned playback
        run: pnpm exec playwright test e2e/studio-animation-c6-3-integrated.spec.ts e2e/studio-animation-c6-2.spec.ts --project=desktop-chromium
      - name: Render approved Kevin 2D locomotion in desktop and touch Chromium
        run: pnpm exec playwright test e2e/studio-animation-c6-3-locomotion-preview.spec.ts --project=desktop-chromium --project=touch-chromium
      - name: Measure grounded skinned-sole and pelvis in desktop/touch WebGL
        run: pnpm exec playwright test e2e/studio-animation-c6-3-ground-contact-review.spec.ts --project=desktop-chromium --project=touch-chromium
      - name: Archive actual skin screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c63-kevin-render-review-${{ github.sha }}
          path: |
            test-results/studio-c6-3/
            test-results/studio-c6-3-locomotion/
            test-results/studio-c6-2/
            test-results/studio-c6-3-ground/
            test-results/**/trace.zip
          if-no-files-found: warn
          retention-days: 14
