name: C6.2 source fit comparison
on:
  push:
    branches: [feat/c6-2-animation-baking-studio-playback]
    paths: ['.github/workflows/c6-2-source-fit-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download acquisition evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/c6-motion-archives
          gh run download 44360056543 -n c6-2-motion-source-probe -D /tmp/c6-motion-archives
          find /tmp/c6-motion-archives -maxdepth 2 -type f -printf '%f %s bytes\n'
      - name: Fetch pinned official MakeHuman rest source
        run: node scripts/fetch-makehuman-core.mjs
      - name: Compare original source rigs and locomotion catalog
        run: python3 scripts/audit-c62-motion-sources.py /tmp/c6-motion-archives .
      - name: Commit evidence to existing draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/character-studio-c6-2-source-fit-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(c6.2): record measured Quaternius vs MakeHuman fit and ACCAD candidates"
            git fetch origin feat/c6-2-animation-baking-studio-playback
            git rebase origin/feat/c6-2-animation-baking-studio-playback
            git push origin HEAD:feat/c6-2-animation-baking-studio-playback
          fi
