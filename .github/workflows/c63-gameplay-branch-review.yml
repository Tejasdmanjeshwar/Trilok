name: C6.3 gameplay branch Chromium review
# Final source-backed Kevin projection review; remove after preserving artifacts.
on:
  push:
    branches: [feat/c6-3-gameplay-locomotion-presentation]
    paths: [.github/workflows/c63-gameplay-branch-review.yml]
permissions:
  contents: read
jobs:
  rendered-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            apps/web/public/anatomy/makehuman-base.obj
            apps/web/public/anatomy/makehuman-default.mhskel
            apps/web/public/anatomy/makehuman-default_weights.mhw
            apps/web/public/anatomy/makehuman-facial-v1.json
            assets/cache/makehuman-body-v1.json
          key: makehuman-pinned-v1-${{ runner.os }}-${{ hashFiles('assets/makehuman-core.json', 'assets/makehuman-body-v1.json', 'assets/makehuman-facial-v1.json', 'scripts/fetch-makehuman-*.mjs', 'scripts/fetch-pinned-source.mjs') }}
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Render actual gameplay approach and combat regessions
        run: pnpm exec playwright test e2e/combat-c6-3-movement-review.spec.ts e2e/combat.spec.ts --project=desktop-chromium --project=touch-chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c63-gameplay-render-${{ github.sha }}
          path: |
            test-results/c63-gameplay/
            test-results/**/trace.zip
          retention-days: 14
          if-no-files-found: warn
