name: C6.3 KayKit CC0 Rig Probe
on:
  push:
    branches: [feat/c6-3-grounded-locomotion]
    paths: [.github/workflows/c63-kaykit-source-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify and extract pinned KayKit CC0 motion curves
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 60 -o /tmp/kaykit.glb \
            https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/672074b73ba276876a19e8816ecdc5241817ab47/addons/kaykit_character_pack_adventures/Characters/gltf/Knight.glb
          node scripts/extract-kaykit-c63.mjs /tmp/kaykit.glb /tmp/kaykit-extracted.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/kaykit-extracted.json"))
          for c in d["clips"]:
            print("SOURCE_CLIP",c["sourceName"],"duration",c["durationSeconds"],"frames",len(c["timesSeconds"]),"nodes",len(c["tracks"]))
            for j in ("root","hips","upperleg.l","upperleg.r","foot.l","foot.r"):
              if j in c["tracks"]:
                print("TRACK",c["sourceName"],j,list(c["tracks"][j]))
          PY
