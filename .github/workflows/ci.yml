name: Verify
on:
  push:
    branches: [main]
  pull_request:

# Intermediate PRs run only fast, deterministic checks. Do not cancel main
# verification when a new PR push arrives.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # pnpm-lock.yaml is committed; fail if dependency resolutions drift.
      - run: pnpm install --frozen-lockfile
      # Every restored output is independently digest/size/license verified by
      # the mandatory pnpm test/build asset acquisition; the cache is untrusted.
      - name: Reuse pinned MakeHuman assets
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public/anatomy/makehuman-base.obj
            apps/web/public/anatomy/makehuman-default.mhskel
            apps/web/public/anatomy/makehuman-default_weights.mhw
            apps/web/public/anatomy/makehuman-facial-v1.json
            assets/cache/makehuman-body-v1.json
          key: makehuman-pinned-v1-${{ runner.os }}-${{ hashFiles('assets/makehuman-core.json', 'assets/makehuman-body-v1.json', 'assets/makehuman-facial-v1.json', 'scripts/fetch-makehuman-*.mjs', 'scripts/fetch-pinned-source.mjs') }}
      - name: Verify checked-in SHA-256 animation bake determinism
        run: pnpm animation:verify
      - run: pnpm typecheck
      # Includes the existing 1,000-seed deterministic combat replay.
      - run: pnpm test
      - run: pnpm build
      - name: Install focused animation browser
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/c6-2-animation-baking-studio-playback'
        run: pnpm exec playwright install --with-deps chromium
      - name: Render C6.2 Studio desktop and touch motion
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/c6-2-animation-baking-studio-playback'
        run: pnpm exec playwright test e2e/studio-animation-c6-2.spec.ts
      - name: Preserve C6.2 rendered frames
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/c6-2-animation-baking-studio-playback'
        uses: actions/upload-artifact@v4
        with:
          name: c6-2-studio-rendered-${{ github.sha }}
          path: test-results/studio-c6-2/
          retention-days: 14
          if-no-files-found: warn
      - name: Verify production build excludes retired diagnostic Lab
        run: test ! -e apps/web/dist/c2-lab.html
      - name: Verify compiled build identity
        run: node scripts/verify-build-identity.mjs
