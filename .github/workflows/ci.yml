name: Verify
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for real browser combat smoke checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke checks
        run: pnpm test:e2e
      - name: Verify compiled build identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const metadata = JSON.parse(readFileSync("apps/web/dist/build-info.json", "utf8"));
          if (metadata.commitSha !== process.env.GITHUB_SHA) {
            throw new Error("Build commit does not match checked-out GitHub SHA");
          }
          const expected = JSON.parse(readFileSync("apps/web/build-version.json", "utf8"));
          if (metadata.playableVersion !== expected.playableVersion || metadata.combatEngineVersion !== expected.combatEngineVersion || metadata.channel !== expected.channel) {
            throw new Error("Unexpected playable or engine version");
          }
          if (!/^.{8}-\d{8}T\d{9}Z$/.test(metadata.buildId)) {
            throw new Error("Invalid generated build ID");
          }
          console.log("Verified Trilok build:", metadata.buildId);
          NODE

      - name: Upload C2 rendered pose screenshots for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-pose-screenshots
          path: test-results/c2/*.png
          if-no-files-found: ignore
          retention-days: 14
