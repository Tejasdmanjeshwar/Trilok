name: C5.4 arrow-rest focused regression
on:
  push:
    branches:
      - feat/c5-4-anatomical-arrow-rest-clearance
permissions:
  contents: read
jobs:
  arrow-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: node scripts/fetch-makehuman-core.mjs
      - run: pnpm exec vitest run tests/character-studio-arrow-rest.test.ts tests/character-studio-archery.test.ts tests/character-studio-archery-partial-continuity.test.ts tests/character-studio-bilateral-symmetry.test.ts --pool=threads --maxWorkers=1
