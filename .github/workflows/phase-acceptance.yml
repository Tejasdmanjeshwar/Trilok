name: Phase Acceptance

# The full Chromium matrix is an explicit phase-closure gate, not a per-slice
# PR check. Select the exact branch/commit to validate in Actions -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase being considered for acceptance"
        required: true
        type: choice
        options: [C0, C1, C2, C3, C4, C5, C6, C7, C8, C9]
      notes:
        description: "Optional acceptance candidate / issue reference"
        required: false
        type: string
      cleanup_report:
        description: "Committed docs/ phase-cleanup report (required for C6–C9)"
        required: false
        type: string

permissions:
  contents: read

# Never cancel a started acceptance run; its SHA and artifacts are evidence.
concurrency:
  group: phase-acceptance-${{ github.ref }}-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  # All deterministic checks must pass before spending runner time on Chromium.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require current-phase cleanup evidence before acceptance
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
          REPORT: ${{ inputs.cleanup_report }}
        run: |
          set -euo pipefail
          if [[ "$PHASE" =~ ^C[6-9]$ ]] || [[ -n "$REPORT" ]]; then
            if [[ ! "$REPORT" =~ ^docs/[a-zA-Z0-9/_-]+[.]md$ ]]; then
              echo "::error::C6+ Phase Acceptance requires a relative docs/*.md cleanup report"; exit 1
            fi
            if [[ ! -f "$REPORT" ]] || ! grep -Fxq "Phase: $PHASE" "$REPORT"; then
              echo "::error::Cleanup report must exist at this SHA and declare Phase: $PHASE"; exit 1
            fi
            echo "Validated cleanup report: $REPORT for $PHASE"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      # Every restored output is independently digest/size/license verified by
      # the mandatory pnpm test/build asset acquisition; the cache is untrusted.
      - name: Reuse pinned MakeHuman assets
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public/anatomy/makehuman-base.obj
            apps/web/public/anatomy/makehuman-default.mhskel
            apps/web/public/anatomy/makehuman-default_weights.mhw
            apps/web/public/anatomy/makehuman-facial-v1.json
            assets/cache/makehuman-body-v1.json
          key: makehuman-pinned-v1-${{ runner.os }}-${{ hashFiles('assets/makehuman-core.json', 'assets/makehuman-body-v1.json', 'assets/makehuman-facial-v1.json', 'scripts/fetch-makehuman-*.mjs', 'scripts/fetch-pinned-source.mjs') }}
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build with diagnostic Lab for legacy E2E parity
        env:
          TRILOK_INCLUDE_LAB: '1'
        run: pnpm build
      - name: Verify exact checkout build identity
        run: node scripts/verify-build-identity.mjs

  # Each viewport keeps one worker for repeatable WebGL measurements, but
  # desktop and touch no longer block one another or share a 40-minute budget.
  browser:
    name: Chromium acceptance (${{ matrix.project }})
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, touch-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      # Every restored output is independently digest/size/license verified by
      # the mandatory pnpm test/build asset acquisition; the cache is untrusted.
      - name: Reuse pinned MakeHuman assets
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public/anatomy/makehuman-base.obj
            apps/web/public/anatomy/makehuman-default.mhskel
            apps/web/public/anatomy/makehuman-default_weights.mhw
            apps/web/public/anatomy/makehuman-facial-v1.json
            assets/cache/makehuman-body-v1.json
          key: makehuman-pinned-v1-${{ runner.os }}-${{ hashFiles('assets/makehuman-core.json', 'assets/makehuman-body-v1.json', 'assets/makehuman-facial-v1.json', 'scripts/fetch-makehuman-*.mjs', 'scripts/fetch-pinned-source.mjs') }}
      - name: Build with diagnostic Lab for legacy E2E parity
        env:
          TRILOK_INCLUDE_LAB: '1'
        run: pnpm build
      - name: Verify exact checkout build identity
        run: node scripts/verify-build-identity.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run complete ${{ matrix.project }} browser suite
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm test:e2e --project="$PROJECT"
      - name: Record tested phase, revision and viewport
        if: always()
        env:
          PHASE: ${{ inputs.phase }}
          NOTES: ${{ inputs.notes }}
          PROJECT: ${{ matrix.project }}
          TESTED_SHA: ${{ github.sha }}
          TESTED_REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## $PHASE acceptance candidate ($PROJECT)"
            echo "- Tested ref: $TESTED_REF"
            echo "- Tested commit: $TESTED_SHA"
            echo "- Project: $PROJECT"
            echo "- Workflow: $RUN_URL"
            if [ -n "$NOTES" ]; then
              echo "- Notes: $NOTES"
            fi
            echo "- Acceptance requires both green browser projects, deterministic checks and rendered screenshot review."
            echo "- This workflow does not automatically mark any phase complete."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload rendered browser screenshots and diagnostics for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-${{ inputs.phase }}-${{ matrix.project }}-evidence
          path: |
            test-results/**/*.png
            test-results/**/*.json
          if-no-files-found: ignore
          retention-days: 14
