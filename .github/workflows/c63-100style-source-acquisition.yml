name: C6.3 Official 100STYLE Source Acquisition
on:
  push:
    branches: [feat/c6-3-grounded-locomotion]
    paths:
      - scripts/probe-c63-100style.py
      - scripts/inspect-c63-100style.mjs
      - scripts/calibrate-c63-100style.mjs
      - e2e/studio-animation-c6-3-100style.spec.ts
      - apps/web/src/studio/StudioAnimationLibrary.ts
      - packages/character-core/src/bvh.ts
      - .github/workflows/c63-100style-source-acquisition.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source-download adapter
        run: python -m pip install --disable-pip-version-check 'gdown==5.2.0'
      - name: Acquire three official Neutral BVHs and frame cut metadata
        run: python -u scripts/probe-c63-100style.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace for typed BVH inspection
        run: pnpm install --frozen-lockfile
      - name: Reuse pinned MakeHuman rig assets
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public/anatomy/makehuman-base.obj
            apps/web/public/anatomy/makehuman-default.mhskel
            apps/web/public/anatomy/makehuman-default_weights.mhw
          key: makehuman-pinned-v1-${{ runner.os }}-${{ hashFiles('assets/makehuman-core.json', 'assets/makehuman-body-v1.json', 'assets/makehuman-facial-v1.json', 'scripts/fetch-makehuman-*.mjs', 'scripts/fetch-pinned-source.mjs') }}
      - name: Verify official MakeHuman C1 calibration assets without facial/body atlas downloads
        run: node scripts/fetch-makehuman-core.mjs --anatomical-rig-only
      - name: Validate official BVHs through TypeScript source FK
        run: node scripts/inspect-c63-100style.mjs
      - name: Measure one shared 100STYLE to MakeHuman anatomical calibration
        run: node scripts/calibrate-c63-100style.mjs --emit-review-blobs
      - name: Retain authenticated source inspection temporarily
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c63-100style-neutral-source-inspection
          path: c63-100style-acquisition/
          retention-days: 2
          if-no-files-found: warn
  browser-review:
    name: C6.3 skinned 100STYLE visual inspection (${{ matrix.project }})
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, touch-chromium]
    steps:
      - name: Checkout exact 100STYLE review SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert checked-out commit identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - name: Restore pinned MakeHuman assets
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public/anatomy/makehuman-base.obj
            apps/web/public/anatomy/makehuman-default.mhskel
            apps/web/public/anatomy/makehuman-default_weights.mhw
            apps/web/public/anatomy/makehuman-facial-v1.json
            assets/cache/makehuman-body-v1.json
          key: makehuman-pinned-v1-${{ runner.os }}-${{ hashFiles('assets/makehuman-core.json', 'assets/makehuman-body-v1.json', 'assets/makehuman-facial-v1.json', 'scripts/fetch-makehuman-*.mjs', 'scripts/fetch-pinned-source.mjs') }}
      - name: Build actual MakeHuman Studio under exact PR SHA
        run: |
          pnpm build
          node scripts/verify-build-identity.mjs
      - name: Install Chromium with SwiftShader support
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture all source-backed Neutral motions on four MakeHuman morphologies
        env:
          CI: '1'
          C63_SHA: ${{ github.sha }}
          PROJECT: ${{ matrix.project }}
        run: pnpm exec playwright test e2e/studio-animation-c6-3-100style.spec.ts --project="$PROJECT" --retries=0 --workers=1 --reporter=list
      - name: Retain immutable screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c63-100style-render-${{ github.sha }}-${{ matrix.project }}
          path: |
            test-results/studio-c6-3-100style/**
            test-results/**/*.png
            test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 14
