name: Temporary Generate pnpm Lockfile
# One-shot lockfile generation, remove before merge.
on:
  pull_request:
    paths: ['.github/workflows/lockfile-generation.yml']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Capture generated dependency resolution for commit
        shell: bash
        run: |
          test -s pnpm-lock.yaml
          echo '__TRILOK_LOCKFILE_START__'
          base64 -w0 pnpm-lock.yaml
          echo
          echo '__TRILOK_LOCKFILE_END__'
