name: C6.2 One-shot Motion Bake
on:
  push:
    branches:
      - feat/c6-2-animation-baking-studio-playback
    paths:
      - .github/workflows/c6-2-motion-bake-once.yml
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm animation:bake
      - name: Remove replaced C6.2 prototype files
        run: |
          git rm assets/animations/reference-v1/relaxed-idle.clip.json assets/animations/reference-v1/controlled-step.clip.json assets/animations/reference-v1/ready-gesture.clip.json
      - name: Commit reproducibly baked reference assets
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/animations/reference-v1
          git commit -m 'build(c6.2): bake idle walk run and retire placeholder clips'
          git push origin HEAD:feat/c6-2-animation-baking-studio-playback
