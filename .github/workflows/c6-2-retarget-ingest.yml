name: C6.2 ingest Quaternius source clips
# v3: pinned official MakeHuman bone directions, including wrists/fingers
on:
  push:
    branches: [feat/c6-2-animation-baking-studio-playback]
    paths: ['.github/workflows/c6-2-retarget-ingest.yml', 'scripts/bake-reference-animations.mjs']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Retrieve verified pinned source without bundling source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/c62
          gh run download 44360056543 -n c6-2-motion-source-probe -D /tmp/c62
          echo 'cc73fc4e495b82958207316596317a3f40b9fa38065bde1027937452da537724  /tmp/c62/UAL1-Standard.zip' | sha256sum -c
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('/tmp/c62/UAL1-Standard.zip') as source:
            glb=next(n for n in source.namelist() if n.endswith('/Unreal-Godot/UAL1_Standard.glb'))
            with open('/tmp/c62/UAL1_Standard.glb','wb') as out: out.write(source.read(glb))
          PY
      - name: Extract three source tracks and bake canonical clips
        run: |
          node scripts/extract-quaternius-ual1.mjs /tmp/c62/UAL1_Standard.glb assets/animations/sources/ual1-standard-locomotion-v1.json
          pnpm animation:bake
          pnpm animation:verify
      - name: Commit reproducible curated source and baked data on draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animations/sources/ual1-standard-locomotion-v1.json assets/animations/reference-v1/
          if ! git diff --cached --quiet; then
            git commit -m "assets(c6.2): bake three verified CC0 UAL1 motions"
            git push origin HEAD:feat/c6-2-animation-baking-studio-playback
          fi
