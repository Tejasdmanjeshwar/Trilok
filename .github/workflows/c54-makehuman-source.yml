name: C5.4 MakeHuman Source Pose Audit

on:
  push:
    branches: [feat/c5-4-anatomical-bow-draw]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-source-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and analyze original MakeHuman CC0 BVH packs
        run: python3 scripts/c54-fetch-makehuman-poses.py
      - name: Preserve checksum-verified source references on feature branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src="test-results/c54-makehuman-reference/poses02"
          test -f "$src/callharvey3d_archer_hero.bvh"
          test -f "$src/callharvey3d_archer_square_stance.bvh"
          printf '%s  %s\\n' \\
            a6750c2d3a1eb27eedd09d04312e55db59f267f9d60b3262392b9c76a65777cc "$src/callharvey3d_archer_hero.bvh" \\
            cbd91e39bad431d684a30893cd0651947a3dda4bb149bb33439dfb597b1b83a7 "$src/callharvey3d_archer_square_stance.bvh" | sha256sum --check
          dst="assets/reference/makehuman/c54-archery"
          mkdir -p "$dst"
          cp "$src"/*.bvh "$src"/*.meta "$dst/"
          cat > "$dst/README.md" <<'NOTE'
          # Source MakeHuman archer pose references — research only

          Source models: `callharvey3d_archer_hero`, `callharvey3d_archer_square_stance`.
          Author: callharvey3d.
          Original MakeHuman asset references: https://www.makehumancommunity.org/node/645 and https://www.makehumancommunity.org/node/642

          The actual BVH and .meta files were recovered from public pinned revision
          `5917810cd4983e9fd757fc44efd39b3dd7648ee0` of
          https://huggingface.co/datasets/lsmpp/omni-refiner-video
          and verified by SHA-256 before import.

          License ambiguity: the bundled original .meta sidecars declare
          `license CC-by`, while the current MakeHuman asset-pack website
          labels the same poses as CC0. Treat as attribution-required research
          reference data pending resolution. Preserve author attribution and
          original metadata; do not ship with runtime game assets or claim
          the CC0 catalog overrides the original .meta license.

          These are 1-frame full-draw poses, not combat animations.
          Source finger and wrist Euler angles must be retargeted through
          Trilok's existing AnatomicalFK, with source .L/.R handedness mapping.
          NOTE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          if ! git diff --cached --quiet; then
            git commit -m "assets(c54): preserve original verified archer BVH and metadata references"
            git push origin HEAD:feat/c5-4-anatomical-bow-draw
          fi
      - name: Preserve source BVH and analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c54-makehuman-original-source-${{ github.sha }}
          path: test-results/c54-makehuman-reference/
          retention-days: 14
          if-no-files-found: warn
