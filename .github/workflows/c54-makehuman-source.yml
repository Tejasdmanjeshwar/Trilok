name: C5.4 MakeHuman Source Pose Audit

on:
  push:
    branches: [feat/c5-4-anatomical-bow-draw]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-source-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and analyze original MakeHuman CC0 BVH packs
        run: python3 scripts/c54-fetch-makehuman-poses.py
      - name: Preserve source BVH and analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c54-makehuman-original-source-${{ github.sha }}
          path: test-results/c54-makehuman-reference/
          retention-days: 14
          if-no-files-found: warn
