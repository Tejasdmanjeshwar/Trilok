name: Studio C5.4 Render Review

# A narrowly scoped PR render check provides screenshots for feedback without
# dispatching the full *phase-level* acceptance gate. Full phase acceptance
# remains manual in phase-acceptance.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'apps/web/src/studio/**'
      - 'e2e/studio-archery.spec.ts'
      - 'tests/character-studio-bow-morphology*.test.ts'
      - '.github/workflows/studio-c54-render-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c54-render-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archery-chromium:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/c5-4-anatomical-bow-draw'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TRILOK_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TRILOK_TESTED_SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - name: Build exact PR head for desktop and touch Chromium
        run: pnpm build
        env:
          GITHUB_SHA: ${{ env.TRILOK_TESTED_SHA }}
      - name: Verify compiled screenshot target revision
        run: node scripts/verify-build-identity.mjs
        env:
          GITHUB_SHA: ${{ env.TRILOK_TESTED_SHA }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Render all five archery states, both grips, desktop and touch
        run: pnpm exec playwright test e2e/studio-archery.spec.ts
      - name: Record screenshot provenance
        if: always()
        run: |
          {
            echo '## C5.4 archery render evidence (not phase acceptance)'
            echo "- Exact source commit: \`$TRILOK_TESTED_SHA\`"
            echo '- Branch preview must be deployed and SHA-verified independently.'
            echo '- Screenshots require visual inspection before user acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reviewable archery screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c54-archery-${{ env.TRILOK_TESTED_SHA }}
          path: |
            test-results/studio/**/*.png
            test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 14
