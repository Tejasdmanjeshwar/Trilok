name: Studio Shield Visual Verify
on:
  pull_request:
    paths:
      - "apps/web/src/studio/StudioShieldGrip.ts"
      - "e2e/studio-shield.spec.ts"
      - ".github/workflows/studio-shield-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-shield-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contact-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Check compiled source identity
        run: node scripts/verify-build-identity.mjs
      - name: Install desktop and touch Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture source-skinned shield handling
        run: pnpm exec playwright test e2e/studio-shield.spec.ts --project=desktop-chromium --project=touch-chromium
      - name: Upload shield screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-shield-visual-${{ github.sha }}
          path: |
            test-results/studio/*.png
            test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 14
