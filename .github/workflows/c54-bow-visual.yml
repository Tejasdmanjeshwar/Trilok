name: C5.4 Bow Visual Evidence

# Slice-level browser capture; this is not the phase-C5 acceptance workflow.
on:
  push:
    branches:
      - feat/c5-4-anatomical-bow-draw
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c54-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-bow-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify exact build identity
        run: node scripts/verify-build-identity.mjs
      - name: Install desktop and touch Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture both hands and five states in desktop/touch Chromium
        run: pnpm exec playwright test e2e/studio-archery.spec.ts
      - name: Capture exact evidence SHA
        if: always()
        env:
          CANDIDATE: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## C5.4 bow browser evidence"
            echo "- Commit: \`$CANDIDATE\`"
            echo "- Run: $RUN_URL"
            echo "- Visual signoff is still required; screenshots do not prove the anatomical pose is acceptable."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full and close-up bow screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c54-bow-desktop-touch-${{ github.sha }}
          path: test-results/studio/
          if-no-files-found: warn
          retention-days: 14
