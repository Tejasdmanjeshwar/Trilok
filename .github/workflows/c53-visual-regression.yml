name: C5.3 Visual Regression
on:
  pull_request:
    paths:
      - 'apps/web/src/studio/**'
      - 'packages/character-core/src/presets.ts'
      - 'e2e/studio-sword-shield.spec.ts'
      - '.github/workflows/c53-visual-regression.yml'
permissions:
  contents: read
concurrency:
  group: c53-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: node scripts/fetch-makehuman-core.mjs
      - run: pnpm build
      - run: node scripts/verify-build-identity.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture both hands and shield stance on desktop and touch
        run: pnpm exec playwright test e2e/studio-sword-shield.spec.ts
      - name: Upload rendered visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c53-chromium-${{ github.sha }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14
